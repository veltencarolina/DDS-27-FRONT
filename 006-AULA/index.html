<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <body>
        <!--TABELAS-->
       <header>
        <h1>TABELAS TOP</h1>
        <main>
            <h2>LOJINHA</h2>
<!--CRIAÇÃO DA TABELA-->
<!-- BORDER(LINE)= PROPRIEDADES DE UMA BORDA-->
        <table border="5">
          <!--THEAD = CABEÇALHO DA TABELA-->
            <thead>
                <!--TR = CRIAÇÃO DE UMA LINHA-->
               <tr>
                <!--TH = CRIAÇÃO DE UMA COLUNA-->
                <th>ID</th>
                <th>NOME</th>
                <th>PREÇO</th>
                <th>QUANTIDADE</th>
                <th>CATEGORIA</th>
               </tr>
            </thead>
            <!--TBODY= CORPO DA TABELA-->
            <tbody>
                <tr>
                    <!--TD = CÉLULA DA LINHA DO CORPO-->
                    <td>001</td>
                    <td>DIRT(ALICE IN CHAINS)</td>
                    <td>R$200</td>
                    <td>2</td>
                    <td>CD'S</td>
                     <td></td>
                     <td></td>
                     <tr>
                      <td> 3</td>
                      <td colspan ="3"> the beatles</td>
                      <td rowspan = "2"> jhonn lennon</td>
                     </tr>
                     <tr>
                        <td>250</td>
                        <td>imagine</td>
                        <td>50</td>
                        <td>R$= 300</td>
                     </tr>
                </tr>
            </tbody>
            <!--TFOOT = RODA PÉ DATABELA-->
            <tfoot>
                <tr>
                    <td colspan="5"> Tabela feita por: Kurt Cobain</td>
                </tr>
            </tfoot>
        </table>
        </main>
       </header>
    </body>
</head>
</html>
